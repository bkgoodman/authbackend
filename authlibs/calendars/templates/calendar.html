<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Booking Control</title>
    <link rel="stylesheet" href="{{ url_for('calendars.static',filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header class="header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button id="backBtn" class="back-btn" title="Go to Today">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M19 12H5M12 19l-7-7 7-7" />
                        </svg>
                    </button>
                    <div>
                        <h1>Booking Control</h1>
                        <div class="subtitle">Select a time slot to book</div>
                    </div>
                </div>
                <button id="myBookingsBtn" class="my-bookings-btn">My Bookings</button>
            </div>
            <div id="myBookingsList" class="my-bookings-list hidden">
                <!-- Populated by JS -->
            </div>
        </header>

        <div class="booking-widget">
            <div class="date-nav">
                <button class="nav-btn" id="prevDate">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 18l-6-6 6-6" />
                    </svg>
                </button>
                <div class="current-date-wrapper">
                    <div class="current-date" id="dateDisplay">Today</div>
                    <input type="date" id="datePicker" class="date-picker-input">
                </div>
                <button class="nav-btn" id="nextDate">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 18l6-6-6-6" />
                    </svg>
                </button>
            </div>

            <div class="time-grid-wrapper">
                <div class="time-grid-scroll-area" id="scrollArea">
                    <div class="time-grid" id="timeGrid">
                        <!-- Generated by JS -->
                    </div>
                </div>
            </div>
        </div>

        <div class="action-bar">
            <div class="selection-info">
                <span class="label">Selected Time</span>
                <span class="value" id="selectionDisplay">None</span>
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="cancelBtn" class="cancel-btn hidden">Cancel</button>
                <button id="bookBtn" class="book-btn" disabled>Book Slot</button>
            </div>
        </div>
    </div>

    <!-- Booking Modal -->
    <div id="bookingModal" class="modal-overlay hidden">
        <div class="modal">
            <h2 id="bookingModalTitle">Book Slot</h2>
            <div class="form-group">
                <label for="bookingDescription">Description</label>
                <input type="text" id="bookingDescription" placeholder="e.g. Project Sync" class="form-input">
            </div>
            <div class="modal-actions">
                <button id="cancelBookingModal" class="cancel-btn">Cancel</button>
                <button id="confirmBookingBtn" class="book-btn">Save</button>
            </div>
        </div>
    </div>

    <!-- Delete Modal -->
    <div id="deleteModal" class="modal-overlay hidden">
        <div class="modal">
            <h2>Delete Booking</h2>
            <p>Are you sure you want to delete this booking?</p>
            <div class="modal-actions">
                <button id="cancelDeleteModal" class="cancel-btn">Cancel</button>
                <button id="confirmDeleteBtn" class="delete-btn">Delete</button>
            </div>
        </div>
    </div>

    <script>
        // Simulate Server Data
        window.SERVER_DATA = {
            currentUser: "Me",
            bookings: [
                {
                    start: "2025-12-14T10:00:00",
                    end: "2025-12-14T11:30:00",
                    user: "Alice Smith",
                    description: "Team Sync",
                    isMine: false
                },
                {
                    start: "2025-12-14T14:00:00",
                    end: "2025-12-14T15:30:00",
                    user: "Me",
                    description: "My Focus Time",
                    isMine: true
                },
                {
                    start: "2025-12-15T09:00:00",
                    end: "2025-12-15T10:00:00",
                    user: "Bob Jones",
                    description: "Client Call",
                    isMine: false
                }
            ]
        };
    </script>
    <script src="{{ url_for('calendars.static',filename='script.js') }}"></script>
</body>

</html>
