{% extends "layout_bootstrap.html" %}
{% block body %}
<div class="container-fluid">
<h2>Resource Reservations</h2>
</div>

<div class="d-flex flex-wrap">

{% for r in resources %}
	{% if resources[r].img %}
	<div class="menubox content hvr-grow-shadow">
		<div class="my-10 p-0 mx-auto">
			<a href="{{ r }}"><img class="menuimg" src="{{ url_for('calendars.static',filename=resources[r].img) }}" alt="{{ resources[r].alt }}"></a>
		</div>
	</div>
	{% endif %}
{% endfor %}
{% endblock %}
