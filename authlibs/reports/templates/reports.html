{% extends "layout_bootstrap.html" %}
{% block head %}
  <link href="{{ url_for('static', filename='css/spinner.css') }}" rel="stylesheet">
{% endblock %}
{% block body %}
	<h2>Reports</h2>
<div class="resourcelist">
	
	<div class="sectionhead">
		<table class="table">
			<tr>
				<th>Report</th>
				<th>Description</th>
				<th></th>
			</tr>
			<tr>
				<td>New Member Report</td>
				<td>Report on usage for members newer than 90 days</td>
				<td><button onClick="runreport('newmemberreport')" class="button btn btn-primary">Report</button></td>
			</td>
			<tr>
				<td>Name Fix</td>
				<td>Fix bad description fields for data in Stripe</td>
				<td><button onClick="runreport('stripenamefix')" class="button btn btn-primary">Report</button></td>
			</td>
			<tr>
				<td>Member Count</td>
				<td>Report counts of Active Members</td>
				<td><button onClick="runreport('membercount')" class="button btn btn-primary">Report</button></td>
			</td>
		</table>
	</div>
	<div id="spinner" style="display:none;  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);">
		<div class="lds-roller"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div>
	</div>
	<div id="datadiv" class="sectionhead">
		<pre style="background-color:antiquewhite;padding:20px" id="reporttext">
		</pre>
	</div>
	

<script type="text/javascript">
	function myDisplay(text) {
			document.getElementById("spinner").style.display="none";
			document.getElementById("reporttext").innerText=text;
	}
	function runreport(report) {
			document.getElementById("spinner").style.display="inline-block";
			fetch("{{ url_for("reports.runreport",report="") }}"+report) 
			    .then(response => response.json())
			    .then(data => myDisplay(data.text))
			    .catch(error => myDisplay('Error:', error));
		}
</script>
{% endblock %}
