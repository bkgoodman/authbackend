{% extends "layout_bootstrap.html" %}
{% block body %}
<div>
<div class="sectionhead"><h3>Edit Sign</h3></div>
  <form action={{ url_for('signs.signs_update',sign=rec.id) }} method="POST">
	{% include 'sign_form.html' %}
	<input type=submit class="btn btn-primary" value="Save changes">
<button type="button" class="btn btn-danger" data-toggle="modal" data-target="#deleteModal">
  Delete Sign
</button>
  </form>

{# Delete Modal #}
<div class="modal fade" id="deleteModal" tabindex="-1" role="dialog" aria-labelledby="deleteModal" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Delete Sign</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
	      Are you really sure you want to delete {{ rec.s_what }}??
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">No</button>
	  <form action={{ url_for('signs.sign_delete',sign=rec.id) }} method="post">
		<input class="btn btn-danger" type=submit value="Delete">
	  </form>
      </div>
    </div>
  </div>
</div>
{# Delete Modal #}

{% endblock %}
